name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Steiger + Typecheck + Vitest
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout (with private contents submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          # contents 서브모듈(`dev-blog-archive`)이 private이므로 fine-grained PAT 필요.
          # GH Actions는 `GITHUB_*` prefix를 예약어로 거부하므로 secret 이름은 REPO_CLONE_TOKEN.
          token: ${{ secrets.REPO_CLONE_TOKEN }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        # 버전은 package.json `packageManager` 필드(`pnpm@11.22.0`)에서 자동 읽음.
        # `with: version: 11` 명시 시 ERR_PNPM_BAD_PM_VERSION으로 fail.

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate next-env.d.ts (gitignore된 Next.js 자동 생성 파일)
        # navigation-types/compat 참조는 루트 pages/ 폴더가 있는 프로젝트에서 next가 생성하는 줄.
        # 이것이 빠지면 usePathname이 CI에서만 non-null로 좁혀져 로컬보다 느슨하게 검사된다.
        # 실제 생성물에 있는 .next/types import 두 줄은 빌드 산출물이 필요해 스텁에 넣지 않는다.
        run: |
          cat > next-env.d.ts <<'EOF'
          /// <reference types="next" />
          /// <reference types="next/image-types/global" />
          /// <reference types="next/navigation-types/compat/navigation" />

          // NOTE: This file should not be edited
          // see https://nextjs.org/docs/app/api-reference/config/typescript for more information.
          EOF

      - name: FSD 경계 검사
        run: pnpm lint:arch

      - name: Typecheck
        run: pnpm type:check

      - name: ESLint
        run: pnpm lint

      # 커밋 훅은 서브모듈이 더러우면 stash에 실패해 --no-verify로 넘기게 된다.
      # 그때 포맷 검사가 통째로 건너뛰어지므로 CI에서 한 번 더 본다
      - name: Prettier
        run: pnpm format:check

      - name: Vitest
        run: pnpm test

  e2e:
    name: Playwright e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout (with private contents submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.REPO_CLONE_TOKEN }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      # webServer가 프로덕션 빌드를 만들고 띄운다. playwright.config.ts를 본다
      - name: Playwright
        run: pnpm test:e2e

      # CI 리포터가 list라 html 리포트는 안 생긴다. trace와 스크린샷이 남는 곳을 올린다
      - name: 실패했을 때 trace와 스크린샷 남기기
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
